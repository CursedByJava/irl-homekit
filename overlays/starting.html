<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Starting soon</title>
  <link rel="stylesheet" href="screen.css">
  <style>
    :root { --a: #ff9f0a; --b: #ff2d55; --c: #64d2ff; --d: #0a0710; }
    .bars { display: flex; align-items: flex-end; gap: 10px; height: 64px; }
    .bars i { width: 12px; border-radius: 6px; background: #fff; animation: eq 1.1s ease-in-out infinite; }
    .bars i:nth-child(1) { animation-delay: -.9s; } .bars i:nth-child(2) { animation-delay: -.3s; } .bars i:nth-child(3) { animation-delay: -.6s; }
    .bars i:nth-child(4) { animation-delay: -.1s; } .bars i:nth-child(5) { animation-delay: -.75s; }
    @keyframes eq { 0%,100% { height: 18%; opacity: .5; } 50% { height: 100%; opacity: 1; } }
    .progress { width: 560px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; }
    .progress span { display: block; height: 100%; width: 35%; border-radius: 999px; background: linear-gradient(90deg, transparent, #fff, transparent); animation: sweep 2.6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes sweep { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <div class="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <main class="stage">
    <div class="stack">
      <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h1 class="title" id="title">Starting soon</h1>
      <p class="sub"><span id="sub">Grab a drink, we're going live in a moment</span><span class="dots"><i></i><i></i><i></i></span></p>
      <div class="progress" aria-hidden="true"><span></span></div>
    </div>
  </main>
  <footer class="footer">
    <span class="chip"><span class="live"></span><span id="channel"></span></span>
    <span class="chip clock" id="clock"></span>
  </footer>
  <script src="screen.js"></script>
</body>
</html>
