<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Low bitrate overlay</title>
  <script src="config.js"></script>
  <style>
    @font-face { font-family: 'Inter'; src: url('../dashboard/public/fonts/InterVariable.woff2') format('woff2'); font-weight: 100 900; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    body { font-family: 'Inter', system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss03'; }
    /* One small line in the bottom-left corner, so it never covers the stream */
    .pill {
      position: absolute; left: 36px; bottom: 36px;
      display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 14px; border-radius: 999px; white-space: nowrap;
      background: rgba(20, 20, 24, .62); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 8px 24px rgba(0,0,0,.3);
      font-size: 22px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
      animation: in .5s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
    .bars i { width: 4px; border-radius: 2px; background: rgba(255,255,255,.25); }
    .bars i:nth-child(1) { height: 25%; } .bars i:nth-child(2) { height: 50%; } .bars i:nth-child(3) { height: 75%; } .bars i:nth-child(4) { height: 100%; }
    .bars i.on { background: #ff9f0a; animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .kbps { color: #ffb340; }
    .sep { color: rgba(255,255,255,.45); }
    .dots { display: inline-flex; gap: 4px; margin-left: 2px; }
    .dots i { width: 5px; height: 5px; border-radius: 50%; background: #fff; opacity: .3; animation: dot 1.4s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 0%,100% { opacity: .25; } 40% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="pill" role="status">
    <span class="bars" id="bars" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></span>
    <span id="title">Low bitrate</span>
    <span class="sep" id="sep" hidden>·</span>
    <span class="kbps" id="kbps" hidden></span>
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
  <script>
    // Shows the live bitrate from go-irl (bonded feed) when available.
    (function () {
      const cfg = window.IRLHK || {};
      const q = new URLSearchParams(location.search);
      if (q.get('title')) document.getElementById('title').textContent = q.get('title');
      const kbpsEl = document.getElementById('kbps'), sep = document.getElementById('sep'), bars = [...document.querySelectorAll('#bars i')];
      let last = 0;
      function show(kbps) {
        last = Date.now();
        const lit = kbps < 400 ? 1 : kbps < 800 ? 2 : kbps < 1500 ? 3 : 4;
        bars.forEach((b, i) => b.classList.toggle('on', i < lit));
        kbpsEl.textContent = kbps.toLocaleString() + ' kbps'; kbpsEl.hidden = sep.hidden = false;
      }
      setInterval(() => { if (Date.now() - last > 4000) { kbpsEl.hidden = sep.hidden = true; bars.forEach((b, i) => b.classList.toggle('on', i === 0)); } }, 1000);
      function connect() {
        let ws; try { ws = new WebSocket(cfg.goirlWs || 'ws://127.0.0.1:8888/ws'); } catch { return setTimeout(connect, 5000); }
        ws.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.type === 'reader' && m.stats) show(Math.round((m.stats.Instantaneous?.MbpsRecvRate || 0) * 1000)); } catch {} };
        ws.onclose = () => setTimeout(connect, 3000);
        ws.onerror = () => {};
      }
      connect();
    })();
  </script>
</body>
</html>
