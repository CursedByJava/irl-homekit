<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="robots" content="noindex, nofollow">
  <title>IRL Homekit · Sign in</title>
  <link rel="icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login card" method="post" action="/login">
      <img src="/icon.svg" width="48" height="48" alt="">
      <h1>IRL Homekit</h1>
      <p>Sign in to control your home streaming PC.</p>
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <div class="err" id="err" role="alert">
        <b>Wrong username or password.</b> Check both and try again. After 5 wrong tries, sign-in is locked for 15 minutes.
      </div>
      <button class="btn go block" type="submit">Sign in</button>
      <div class="foot">You stay signed in on this device for 30 days.</div>
    </form>
  </div>
  <script src="/app.js"></script>
</body>
</html>
