# Publishes a GitHub release when a version tag is pushed (e.g. v1.0.0-beta.2), with that version's section of
# CHANGELOG.md as the notes. Versions with a "-" (betas) are marked as pre-releases. The app's update checker reads
# these releases.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION matches the tag
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME" || { echo "VERSION says $(cat VERSION), tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## [$ver]' section in CHANGELOG.md"; exit 1; }
          printf '\n---\n**Install:** download the source code zip below, extract it and double-click `Install IRL Homekit.cmd`.\n**Update:** IRL Homekit offers this update by itself (or Start menu > IRL Homekit - Check for updates).\n' >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "IRL Homekit ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre
